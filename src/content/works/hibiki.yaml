order: 5
tech:
  - Rust
  - wgpu
  - WASAPI
  - SQLite
ja:
  name: Hibiki
  summary: beatoraja をモチーフにした、Windows 11 専用の BMS リズムゲームクライアントです。Rust で実装し、音声と判定の遅れと揺れを抑える設計にしています。画面は自前の UI で作り、選曲、プレイ、リザルト、リプレイ、OBS 連携を備えています。個人利用のため、公開リポジトリはありません。
  detail:
    lead: beatoraja をモチーフにした、Windows 11 専用の BMS リズムゲームクライアントです。Rust で実装しています。重視しているのは、低遅延と、描画・音声の安定です。画面は beatoraja のスキンを使わず、自前の UI で作っています。
    sections:
      - heading: できること
        points:
          - label: プレイ
            text: 1P 側の 7KEYS を遊べます。判定とゲージは、IIDX に準拠した表を使います。
          - label: 選曲とリザルト
            text: 難易度表、検索、お気に入り、コースに対応しています。リザルトでは、スコアと、自己ベストなどのゴーストを見比べられます。
          - label: リプレイ
            text: プレイを保存して再生できます。単曲のリプレイは、画面と同じ見え方の mp4 に書き出せます。
          - label: 独自の機能
            text: 譜面の特性を 6 軸で示すノーツレーダー、自己ベストやライバルを重ねるゴースト、苦手な配置を示す弱点ヒートマップがあります。選曲やリザルトでは、事前に生成した読み上げボイスが話しかけます。
          - label: 外とのつながり
            text: 独自の IR サーバーに接続してランキングとライバルを取得します。OBS のオーバーレイ、BGA 動画、YouTube のチャットからの曲リクエストにも対応しています。
      - heading: 仕組み
        body:
          - 16 個のクレートに分け、依存の向きを一方向にそろえています。画面のロジックは GPU・時計・OS に依存させず、Linux の CI でテストできるようにしています。
        diagram:
          caption: Hibiki の構成（上から下へ、依存が向かいます）
          rows:
            - label: 実行ファイル
              nodes:
                - name: hibiki
                  note: 画面遷移、設定、ウィンドウ、各スレッドの結線
            - label: 画面
              nodes:
                - name: 画面のロジック
                  note: 選曲・プレイ・リザルト・設定の状態
                - name: UI と文字
                  note: トークン、レイアウト、グリフアトラス
                - name: 描画
                  note: wgpu（D3D12）
            - label: ゲームの核
              nodes:
                - name: 譜面
                  note: BMS・bmson の読込と時刻展開
                - name: 判定
                  note: スコア、ゲージ、リプレイ
                - name: 音声
                  note: WASAPI 排他とミキサ
                - name: 入力
                  note: Raw Input
            - label: 保存と通信
              nodes:
                - name: データベース
                  note: 楽曲とスコア（SQLite）
                - name: IR
                  note: 独自サーバーへの接続
                - name: OBS
                  note: オーバーレイのサーバー
      - heading: 技術スタック
        points:
          - label: 言語
            text: Rust です。GC による停止を避けるために選びました。
          - label: 音声
            text: WASAPI の排他モードを直接実装しています。ミキサは自前で、同時発音の数と出力の遅延は実測して確かめました。
          - label: 入力
            text: Raw Input でキーボードとゲームパッドを読みます。DirectInput は使いません。
          - label: 描画
            text: wgpu（D3D12）です。文字は cosmic-text で組み、グリフをキャッシュして描きます。
          - label: データ
            text: rusqlite（SQLite を同梱）で、楽曲 DB とスコア DB を独自のスキーマで持ちます。
          - label: 通信
            text: OBS のオーバーレイは axum（HTTP と SSE）、IR と難易度表の取得は ureq です。
          - label: 動画
            text: BGA は Media Foundation で再生し、開けない動画は ffmpeg で補います。
      - heading: 低遅延への配慮
        body:
          - 音声・判定・入力のスレッドでは、メモリの割り当て、ロックの待ち、入出力、ログを避けています。スレッドの間は、ロックを使わないキューで受け渡します。
          - 曲が流れている間は、判定とコンボ以外を動かしません。重い処理は、曲の前に終わらせるか、別のスレッドに任せます。
      - heading: 開発の進め方
        body:
          - 仕様書はリポジトリの中に置き、コードに合わせて保ちます。新しい機能は、実装の前に仕様書へ書きます。
          - 実装はテスト駆動で進めます。設計、実装、テストの実行、レビューを、AI エージェントに役割を分けて任せ、要件の判断と受け入れは自分で行います。CI では、フォーマット、clippy（Linux と Windows 向け）、テストを回します。
en:
  name: Hibiki
  summary: A BMS rhythm game client for Windows 11, inspired by beatoraja. Written in Rust and designed to keep audio and judgment latency low and steady. It has its own UI and covers song select, play, results, replays and OBS integration. Built for personal use, so there is no public repository.
  detail:
    lead: A BMS rhythm game client for Windows 11, inspired by beatoraja, written in Rust. What I care about most is low latency and stable rendering and audio. It does not use beatoraja skins; the screens are built with its own UI.
    sections:
      - heading: What it can do
        points:
          - label: Play
            text: You can play 7KEYS on the 1P side. Judgment and gauges use tables that follow IIDX.
          - label: Song select and results
            text: It supports difficulty tables, search, favorites and courses. On the result screen you can compare your score with ghosts such as your personal best.
          - label: Replays
            text: Plays can be saved and played back. A single-song replay can be exported as an mp4 that looks the same as on screen.
          - label: Original features
            text: There is a note radar that shows a chart's character on 6 axes, ghosts that overlay your best or a rival, and a weakness heatmap that points out patterns you struggle with. On song select and results, pre-generated spoken voice lines talk to you.
          - label: Connections
            text: It connects to my own IR server to fetch rankings and rivals. It also supports an OBS overlay, BGA video, and song requests from YouTube chat.
      - heading: How it works
        body:
          - It is split into 16 crates with dependencies pointing one way. The screen logic does not depend on the GPU, the clock or the OS, so it can be tested in Linux CI.
        diagram:
          caption: Hibiki architecture (dependencies point from top to bottom)
          rows:
            - label: Executable
              nodes:
                - name: hibiki
                  note: Screen flow, settings, window and thread wiring
            - label: Screens
              nodes:
                - name: Screen logic
                  note: State of song select, play, results and settings
                - name: UI and text
                  note: Tokens, layout and glyph atlas
                - name: Rendering
                  note: wgpu (D3D12)
            - label: Game core
              nodes:
                - name: Charts
                  note: Loads BMS and bmson and expands timing
                - name: Judgment
                  note: Score, gauge and replays
                - name: Audio
                  note: WASAPI exclusive mode and mixer
                - name: Input
                  note: Raw Input
            - label: Storage and network
              nodes:
                - name: Databases
                  note: Songs and scores (SQLite)
                - name: IR
                  note: Connection to my own server
                - name: OBS
                  note: Overlay server
      - heading: Tech stack
        points:
          - label: Language
            text: Rust, chosen to avoid garbage-collection pauses.
          - label: Audio
            text: WASAPI exclusive mode implemented directly. The mixer is my own, and I measured the number of simultaneous voices and the output latency.
          - label: Input
            text: Raw Input reads keyboards and gamepads. DirectInput is not used.
          - label: Rendering
            text: wgpu (D3D12). Text is shaped with cosmic-text and drawn from a cached glyph atlas.
          - label: Data
            text: rusqlite (with SQLite bundled) holds the song and score databases with my own schemas.
          - label: Networking
            text: The OBS overlay uses axum (HTTP and SSE); IR and difficulty-table fetching use ureq.
          - label: Video
            text: BGA plays through Media Foundation, with ffmpeg as a fallback for videos it cannot open.
      - heading: Keeping latency low
        body:
          - The audio, judgment and input threads avoid memory allocation, lock waits, I/O and logging. Threads hand data to each other through lock-free queues.
          - While a song is playing, nothing moves except judgment and combo. Heavy work is finished before the song starts or handed to another thread.
      - heading: How it is developed
        body:
          - The spec lives in the repository and is kept in line with the code. A new feature is written into the spec before it is implemented.
          - Implementation is test-driven. Design, implementation, test runs and review are split among AI agents by role, while I make the requirement decisions and accept the results. CI runs formatting, clippy (for Linux and Windows) and the tests.
