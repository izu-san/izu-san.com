order: 3
tech:
  - Python
  - Electron
  - ローカル LLM
ja:
  name: MaidAI
  summary: ローカル LLM で動く、会話 AI「梨乃」を常駐させるデスクトップクライアントです。会話、音声、生活通知をつなぎ、操作は承認と監査を通す設計にしています。個人利用のため、公開リポジトリはありません。
  detail:
    - ローカル LLM で動く会話 AI「梨乃」を、デスクトップに常駐させるクライアントです。クラウドの API に会話を預けず、手元の環境で動かすことを前提にしています。
    - 会話、音声、生活通知を 1 つのクライアントにつないでいます。梨乃が提案する操作は、そのまま実行せず、承認を通し、記録（監査）を残す設計です。
    - 実装は Python と Electron です。個人利用のため、公開リポジトリはありません。
en:
  name: MaidAI
  summary: A desktop client that keeps a conversational AI character, Rino, running on a local LLM. It connects chat, voice and daily-life notifications, and routes actions through approval and audit. Built for personal use, so there is no public repository.
  detail:
    - A desktop client that keeps a conversational AI character, Rino, running on a local LLM. It is designed to run on my own machine instead of handing conversations to a cloud API.
    - "It connects chat, voice and daily-life notifications in one client. Actions that Rino proposes are not executed directly: they go through approval and leave an audit record."
    - It is built with Python and Electron. It is for personal use, so there is no public repository.
